<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>progressive/</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                950: "#0e0e0f",
              },
            },
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              mono: ["DM Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .active\:scale-97:active {
        transform: scale(0.97);
      }
      .active\:scale-98:active {
        transform: scale(0.98);
      }
      /* Sync controls overlay the right-hand side of the Elm-rendered nav bar.
         pointer-events are re-enabled per child so the bar never swallows taps. */
      #sync-bar {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        width: 100%;
        max-width: 480px;
        height: 3.5rem;
        padding-right: 1rem;
        pointer-events: none;
      }
      #sync-bar > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body class="bg-gray-950">
    <div id="elm-app"></div>
    <div id="sync-bar"></div>

    <!-- Compiled Elm output -->
    <script src="dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>

    <script>
      // ── Storage shim ──────────────────────────────────────────────────────────────
      // Bridges Elm ports ↔ a storage backend. Two backends exist and share one
      // interface; which one is live is decided once, before the first load, so
      // `storageLoaded` fires exactly once (it resets the Log and History
      // sub-models, so a second fire mid-session would wipe the screen).
      //
      //   supabase — signed in. Rows scoped to auth.uid() by RLS.
      //   local    — signed out, unconfigured, or Supabase unreachable.

      const KEY_PREFIX = "progressive_";
      const EX_PREFIX = "progressive_ex_";
      const DRAFT_KEY = "progressive_draft_v1";
      const ROUTINES_KEY = "progressive_routines_v1";

      const CFG = window.SUPABASE_CONFIG || {};
      const CONFIGURED = Boolean(
        CFG.url &&
        CFG.anonKey &&
        !CFG.url.includes("YOUR_PROJECT") &&
        !CFG.anonKey.includes("YOUR_ANON_KEY"),
      );

      const sb =
        CONFIGURED && window.supabase
          ? window.supabase.createClient(CFG.url, CFG.anonKey)
          : null;

      // ── Backends ──────────────────────────────────────────────────────────────────
      // `entries(prefix)` is what lets the exercise list be discovered rather than
      // hardcoded — an exercise added in Manage is now found again on reload.

      const localBackend = {
        name: "local",
        async entries(prefix) {
          return Object.keys(localStorage)
            .filter((k) => k.startsWith(prefix))
            .map((k) => [k, localStorage.getItem(k)]);
        },
        async set(key, value) {
          localStorage.setItem(key, value);
        },
        async del(key) {
          localStorage.removeItem(key);
        },
      };

      let userId = null;

      const supabaseBackend = {
        name: "supabase",
        async entries(prefix) {
          const { data, error } = await sb
            .from("kv")
            .select("key, value")
            .like("key", prefix + "%");
          if (error) throw error;
          // Stored as jsonb so it stays queryable in SQL; Elm's ports speak strings.
          return data.map((r) => [r.key, JSON.stringify(r.value)]);
        },
        async set(key, value) {
          const { error } = await sb
            .from("kv")
            .upsert(
              { user_id: userId, key: key, value: JSON.parse(value) },
              { onConflict: "user_id,key" },
            );
          if (error) throw error;
        },
        async del(key) {
          const { error } = await sb.from("kv").delete().eq("key", key);
          if (error) throw error;
        },
      };

      let backend = localBackend;

      // ── Backend selection ─────────────────────────────────────────────────────────

      const backendReady = (async () => {
        if (!sb) return;
        try {
          const {
            data: { session },
          } = await sb.auth.getSession();
          if (session) {
            userId = session.user.id;
            backend = supabaseBackend;
          }
        } catch (e) {
          console.warn("session lookup failed", e);
        }
      })();

      // ── Init ──────────────────────────────────────────────────────────────────────

      const today = new Date().toISOString().slice(0, 10);

      const app = Elm.Main.init({
        node: document.getElementById("elm-app"),
        flags: { today },
      });

      // ── Port handlers ─────────────────────────────────────────────────────────────

      function safeParse(raw) {
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      async function sendAll(be) {
        const entries = await be.entries(KEY_PREFIX);
        const map = new Map(entries);
        const db = {};
        for (const [k, raw] of map) {
          if (!k.startsWith(EX_PREFIX)) continue;
          const parsed = safeParse(raw);
          if (parsed) db[k.slice(EX_PREFIX.length)] = parsed;
        }
        app.ports.storageLoaded.send({
          db: Object.keys(db).length > 0 ? db : null,
          routines: safeParse(map.get(ROUTINES_KEY)),
          draft: safeParse(map.get(DRAFT_KEY)),
        });
      }

      // First sign-in on a device that has local history: lift it into the
      // account. Guarded on the account being *completely* empty, so signing in
      // somewhere with stale local data can never clobber good cloud data.
      async function seedFromLocalIfEmpty() {
        const remote = await supabaseBackend.entries(KEY_PREFIX);
        if (remote.length > 0) return;
        const local = await localBackend.entries(KEY_PREFIX);
        if (local.length === 0) return;
        for (const [k, v] of local) {
          if (k === DRAFT_KEY) continue; // in-progress state, not history
          await supabaseBackend.set(k, v);
        }
        console.info("seeded " + local.length + " local keys into Supabase");
      }

      app.ports.loadAll.subscribe(async () => {
        await backendReady;
        try {
          if (backend.name === "supabase") await seedFromLocalIfEmpty();
          await sendAll(backend);
        } catch (e) {
          // Never leave Elm sitting on "Loading…": fall back to this device and
          // say so, rather than hanging on a failed network read.
          console.error("load failed", e);
          backend = localBackend;
          setStatus("error", "Sync unavailable — using this device only");
          await sendAll(localBackend);
        }
        renderSyncBar();
      });

      // Writes are serialised per key so a queued save can never land after the
      // delete that was meant to supersede it.
      const queues = new Map();
      function enqueue(key, fn) {
        const next = (queues.get(key) || Promise.resolve())
          .then(fn)
          .catch((e) => {
            console.error("write failed", key, e);
            setStatus("error", "Save failed — check connection");
          });
        queues.set(key, next);
        return next;
      }

      app.ports.saveExercise.subscribe(({ key, value }) => {
        enqueue(key, () => backend.set(key, value));
      });

      app.ports.saveRoutines.subscribe(({ key, value }) => {
        enqueue(key, () =>
          backend
            .set(key, value)
            .then(() => app.ports.storageRoutinesSaved.send(null)),
        );
      });

      app.ports.saveDraft.subscribe(({ key, value }) => {
        enqueue(key, () =>
          backend
            .set(key, value)
            .then(() => app.ports.storageDraftSaved.send(null)),
        );
      });

      app.ports.deleteDraft.subscribe(({ key }) => {
        enqueue(key, () => backend.del(key));
      });

      // ── Sync UI ───────────────────────────────────────────────────────────────────
      // Deliberately outside the Elm node: signing in gates *sync*, not the app, so
      // someone arriving from a link gets a working tracker on localStorage.

      const bar = document.getElementById("sync-bar");
      let status = null;

      function setStatus(kind, message) {
        status = { kind: kind, message: message };
        renderSyncBar();
      }

      function renderSyncBar() {
        if (!sb) return;
        bar.replaceChildren();

        if (status && status.kind === "error") {
          const note = document.createElement("span");
          note.className = "text-xs text-amber-400 font-mono";
          note.textContent = status.message;
          bar.append(note);
          return;
        }

        const btn = document.createElement("button");
        btn.className =
          "text-xs font-mono px-2.5 py-1 rounded-md border transition-colors " +
          (backend.name === "supabase"
            ? "border-lime-700 text-lime-400"
            : "border-gray-700 text-gray-500");
        btn.textContent = backend.name === "supabase" ? "synced" : "sync";
        btn.onclick = backend.name === "supabase" ? signOut : signIn;
        bar.append(btn);
      }

      async function signIn() {
        const email = window.prompt("Email for a sign-in link:");
        if (!email) return;
        const { error } = await sb.auth.signInWithOtp({
          email: email,
          options: { emailRedirectTo: window.location.href },
        });
        setStatus(
          error ? "error" : "info",
          error ? "Sign-in failed" : "Check your email",
        );
      }

      async function signOut() {
        await sb.auth.signOut();
        window.location.reload();
      }

      // A sign-in completes by redirecting back here; reload so the backend is
      // chosen once, on a clean boot, instead of swapping under a live session.
      //
      // `await backendReady` is load-bearing: without it this races the initial
      // session lookup, reads a still-local backend on a page that *did* boot
      // signed in, and reloads forever.
      if (sb) {
        sb.auth.onAuthStateChange((event) => {
          // supabase-js runs this callback while holding its auth lock, so any
          // await on the client from inside it deadlocks getSession() — which
          // hangs the whole boot on "Loading…". Defer out of the lock first.
          setTimeout(async () => {
            await backendReady;
            if (event === "SIGNED_IN" && backend.name !== "supabase") {
              window.location.reload();
            }
          }, 0);
        });
      }
    </script>
  </body>
</html>
